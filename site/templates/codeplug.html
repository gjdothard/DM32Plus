<section class="wrap section cps-page">
	<div class="cps-heading">
		<h1>{{t editor.title}}</h1>
		<details class="cps-firmware">
			<summary>{{t editor.firmware}}</summary>
			<nav aria-label="{{t editor.firmware}}">
				<a href="{{home}}flash/index.html#radio={{product_board}}">{{t flash.product.install}}</a>
				<a href="{{home}}flash/index.html#update">{{t flash.product.upgrade}}</a>
			</nav>
		</details>
	</div>
	<div id="editor" class="editor"><p class="muted">{{t editor.loading}}</p></div>
	<noscript><p class="notice">{{t editor.noscript}}</p></noscript>
</section>
