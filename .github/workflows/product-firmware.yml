name: Product firmware

on:
  push:
    branches: [Development, Testing]

env:
  PRODUCT_FILE: boards/dm32/product.json

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/Testing' && 'product-testing-prerelease' || 'product-development-prerelease' }}
  queue: max

jobs:
  firmware:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the prerelease version
        id: version
        run: |
          set -euo pipefail
          channel=beta
          if [[ "$GITHUB_REF" == refs/heads/Testing ]]; then channel=rc; fi
          base="v$(jq -er .version "$PRODUCT_FILE")"
          version=$(PYTHONPATH=tools BASE="$base" CHANNEL="$channel" python3 - <<'PY'
          import os, subprocess
          from release_version import next_prerelease, newest
          base, channel = os.environ["BASE"], os.environ["CHANNEL"]
          tags = subprocess.check_output(["git", "tag", "--list"], text=True).splitlines()
          current = subprocess.check_output(["git", "tag", "--points-at", "HEAD"], text=True).splitlines()
          existing = newest(t for t in current if t.startswith(base + "-" + channel + "."))
          print(existing or next_prerelease(base, channel, tags))
          PY
          )
          python3 tools/release_version.py prerelease "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Check out the pinned FreeRTOS dependency
        run: git submodule update --init -- third_party/FreeRTOS-Kernel

      - uses: ./.github/actions/toolchain
        id: toolchain
        with:
          toolchain: csky

      - name: Build and check task stacks
        env:
          RUN: ${{ steps.toolchain.outputs.run }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          board=$(jq -er .board "$PRODUCT_FILE")
          product=$(jq -er .name "$PRODUCT_FILE")
          ${RUN:+"$RUN"} make -j"$(nproc)" BOARD="$board" RELEASE="$VERSION"
          ${RUN:+"$RUN"} make BOARD="$board" RELEASE="$VERSION" stack-check
          python3 tools/release.py --board "$board" --product "$product" --version "$VERSION" \
            --git "$(git rev-parse HEAD)" --bin "build/$board/rfoundry_$board.bin" --out dist \
            --toolchain "csky-elf-gcc $(${RUN:+"$RUN"} csky-elf-gcc -dumpfullversion | tail -n 1)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-firmware
          path: dist/
          if-no-files-found: error

  prerelease:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: product-firmware
          path: dist

      - name: Tag and publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.firmware.outputs.version }}
          TAG: ${{ needs.firmware.outputs.tag }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          tag="$TAG"
          prefix=$(jq -er .prefix "$PRODUCT_FILE")
          board=$(jq -er .board "$PRODUCT_FILE")
          product=$(jq -er .name "$PRODUCT_FILE")
          commit=$(jq -er .git_full "dist/$prefix-$board-$VERSION.json")
          if ! tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null); then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$commit" --silent
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          fi
          [[ "$tagged" == "$commit" ]] || { echo "::error::$tag points to a different commit"; exit 1; }

          args=(--repo "$GITHUB_REPOSITORY")
          notes="Development prerelease. Select Development in the product CPS to install or upgrade. The build and static task-stack checks passed."
          title="$product $VERSION"
          draft_options=()
          if [[ "$tag" == *-rc.* ]]; then
            title="RC $title"
            notes="Testing release candidate. The build and static task-stack checks passed."
            draft_options=(--title "$title")
          fi
          assets=("dist/$prefix-$board-$VERSION.bin" "dist/$prefix-$board-$VERSION.json" dist/SHA256SUMS)
          if draft=$(gh release view "$tag" "${args[@]}" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" "${assets[@]}" "${args[@]}" --clobber
              gh release edit "$tag" "${args[@]}" --draft=false --prerelease "${draft_options[@]}"
            else
              echo "$tag is already published"
            fi
          else
            gh release create "$tag" "${assets[@]}" "${args[@]}" --verify-tag --prerelease \
              --title "$title" --notes "$notes"
          fi

  testing-website:
    if: github.ref == 'refs/heads/Testing'
    needs: [firmware, prerelease]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: product-firmware
          path: build/website-firmware
      - name: Test and build the Testing CPS
        env:
          VERSION: ${{ needs.firmware.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install -r site/requirements.txt
          python3 site/tests/fixtures.py build/site-tests
          node --test site/tests/*.test.mjs
          python3 tests/host/websiteTestingTest.py
          python3 site/build.py --strict --out build/website-testing --firmware build/website-firmware --ref "$GITHUB_SHA"
          python3 tools/website/package.py --site build/website-testing --product "$PRODUCT_FILE" \
            --version "$VERSION" --channel Testing --public-url https://testing.cps.pplan.net \
            --out "build/website-testing-$VERSION.tar.gz"
          gh release upload "$VERSION" "build/website-testing-$VERSION.tar.gz" --clobber
