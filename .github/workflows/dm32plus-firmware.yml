name: DM32Plus firmware

on:
  push:
    branches: [Development]
    tags: ["dm32plus-v*b*"]

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pinned FreeRTOS dependency
        run: git submodule update --init -- third_party/FreeRTOS-Kernel

      - uses: ./.github/actions/toolchain
        id: toolchain
        with:
          toolchain: csky

      - name: Build and check task stacks
        env:
          RUN: ${{ steps.toolchain.outputs.run }}
        run: |
          set -euo pipefail
          version=
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#dm32plus-}
            [[ "$version" =~ ^v[0-9]{2}\.[0-9]{1,2}(\.[0-9]+)?b[0-9]+$ ]]
            python3 tools/release_version.py check "$version"
            git merge-base --is-ancestor HEAD refs/remotes/origin/Development
          fi
          ${RUN:+"$RUN"} make -j"$(nproc)" BOARD=dm32 RELEASE="$version"
          ${RUN:+"$RUN"} make BOARD=dm32 RELEASE="$version" stack-check
          if [[ -n "$version" ]]; then
            python3 tools/release.py --board dm32 --product DM32Plus --version "$version" \
              --git "$(git rev-parse HEAD)" --bin build/dm32/rfoundry_dm32.bin --out dist \
              --toolchain "csky-elf-gcc $(${RUN:+"$RUN"} csky-elf-gcc -dumpfullversion | tail -n 1)"
          else
            mkdir -p dist
            cp build/dm32/rfoundry_dm32.bin "dist/dm32plus-dm32-${GITHUB_SHA:0:8}.bin"
            (cd dist && sha256sum *.bin > SHA256SUMS)
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dm32plus-firmware
          path: dist/
          if-no-files-found: error

  prerelease:
    if: github.ref_type == 'tag'
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dm32plus-firmware
          path: dist

      - name: Publish the tagged Development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.bin dist/*.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "DM32Plus ${GITHUB_REF_NAME#dm32plus-}" \
            --notes "Development prerelease for DM-32UV. Select Development in DM32Plus CPS to install or upgrade. The build and static task-stack checks passed."
