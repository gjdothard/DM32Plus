name: DM32Plus firmware

on:
  push:
    branches: [Development]
    tags: ["dm32plus-v*b*"]

permissions:
  contents: read

concurrency:
  group: dm32plus-development-prerelease
  queue: max

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the prerelease version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#dm32plus-}
            git merge-base --is-ancestor HEAD refs/remotes/origin/Development
          else
            version=$(PYTHONPATH=tools python3 - <<'PY'
          from datetime import datetime, timezone
          import subprocess
          from release_version import is_prerelease, newest, parse

          def versions(*options):
              tags = subprocess.check_output(["git", "tag", "--list", *options, "dm32plus-v*"], text=True)
              return [tag.removeprefix("dm32plus-") for tag in tags.splitlines()]

          existing = newest(v for v in versions("--points-at", "HEAD") if is_prerelease(v))
          if existing:
              print(existing)
          else:
              timestamp = int(subprocess.check_output(["git", "show", "-s", "--format=%ct", "HEAD"], text=True))
              date = datetime.fromtimestamp(timestamp, timezone.utc)
              year, month = date.year % 100, date.month
              series = f"v{year:02}.{month}"
              latest = newest(v for v in versions() if (key := parse(v)) and key[:2] == (year, month))
              patch, beta = 0, 1
              if latest:
                  _, _, patch, (_, previous_beta) = parse(latest)
                  if 0 < previous_beta < 999:
                      beta = previous_beta + 1
                  else:
                      patch += 1
              print(series + (f".{patch}" if patch else "") + f"b{beta}")
          PY
            )
          fi
          python3 tools/release_version.py prerelease "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building DM32Plus $version"

      - name: Check out the pinned FreeRTOS dependency
        run: git submodule update --init -- third_party/FreeRTOS-Kernel

      - uses: ./.github/actions/toolchain
        id: toolchain
        with:
          toolchain: csky

      - name: Build and check task stacks
        env:
          RUN: ${{ steps.toolchain.outputs.run }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ${RUN:+"$RUN"} make -j"$(nproc)" BOARD=dm32 RELEASE="$VERSION"
          ${RUN:+"$RUN"} make BOARD=dm32 RELEASE="$VERSION" stack-check
          python3 tools/release.py --board dm32 --product DM32Plus --version "$VERSION" \
            --git "$(git rev-parse HEAD)" --bin build/dm32/rfoundry_dm32.bin --out dist \
            --toolchain "csky-elf-gcc $(${RUN:+"$RUN"} csky-elf-gcc -dumpfullversion | tail -n 1)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dm32plus-firmware
          path: dist/
          if-no-files-found: error

  prerelease:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dm32plus-firmware
          path: dist

      - name: Tag and publish the Development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.firmware.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          tag="dm32plus-$VERSION"
          commit=$(jq -er .git_full "dist/dm32plus-dm32-$VERSION.json")
          if ! tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null); then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$commit" --silent
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          fi
          [[ "$tagged" == "$commit" ]] || { echo "::error::$tag points to a different commit"; exit 1; }

          args=(--repo "$GITHUB_REPOSITORY")
          notes="Development prerelease for DM-32UV. Select Development in DM32Plus CPS to install or upgrade. The build and static task-stack checks passed."
          assets=("dist/dm32plus-dm32-$VERSION.bin" "dist/dm32plus-dm32-$VERSION.json" dist/SHA256SUMS)
          if draft=$(gh release view "$tag" "${args[@]}" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" "${assets[@]}" "${args[@]}" --clobber
              gh release edit "$tag" "${args[@]}" --draft=false --prerelease
            else
              echo "$tag is already published"
            fi
          else
            gh release create "$tag" "${assets[@]}" "${args[@]}" --verify-tag --prerelease \
              --title "DM32Plus $VERSION" --notes "$notes"
          fi
